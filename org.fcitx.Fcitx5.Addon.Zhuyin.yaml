app-id: org.fcitx.Fcitx5.Addon.Zhuyin
runtime: org.fcitx.Fcitx5
runtime-version: stable
sdk: org.kde.Sdk//6.11
build-extension: true
separate-locales: false
build-options:
  prefix: /app/addons/Zhuyin
  prepend-pkg-config-path: /app/addons/Zhuyin/lib/pkgconfig
  prepend-ld-library-path: /app/addons/Zhuyin/lib
  ldflags: -L/app/addons/Zhuyin/lib
  cflags: -I/app/addons/Zhuyin/include
  cxxflags: -I/app/addons/Zhuyin/include
  no-debuginfo: true
  strip: true
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - '*.la'
modules:
  - name: kyotocabinet
    config-opts:
      - --disable-opt
      - --disable-static
    sources:
      - type: archive
        url: https://dbmx.net/kyotocabinet/pkg/kyotocabinet-1.2.80.tar.gz
        sha512: 9fe0a92c9a76db5ce06ef4d5a551c05930f2a9c065ab695b030fdaf45692bfe88d91f1b75791f50d0772c699567744cd74f3ef407172874d4bba467989d54328
        x-checker-data:
          type: anitya
          project-id: 1530
          url-template: https://dbmx.net/kyotocabinet/pkg/kyotocabinet-${version}.tar.gz
    post-install:
      - rm ${FLATPAK_DEST}/lib/*.a
  - name: libpinyin
    config-opts:
      - --with-dbm=KyotoCabinet
      - --enable-libzhuyin
    sources:
      - type: git
        url: https://github.com/libpinyin/libpinyin
        tag: 2.11.91
        x-checker-data:
          type: git
          tag-pattern: '^v?([0-9]+(?:\.[0-9]+)+)$'
        commit: 0c5e80e1200f84fab185d1c5bde458b770a0636c
      - type: file
        url: https://downloads.sourceforge.net/libpinyin/model20.text.tar.gz
        sha256: 59c68e89d43ff85f5a309489499cbcde282d2b04bd91888734884b7defcb1155
        dest: data
      - type: shell
        commands:
          - sed -i "/wget.*/d" data/Makefile.am
    make-args:
      - V=1
  - name: fcitx5-zhuyin
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/fcitx/fcitx5-zhuyin
        tag: 5.1.9
        commit: 18511eca982a9ee6b7e9f9bc8edb030660ee8d1e
      - type: file
        url: http://download.fcitx-im.org/data/model.text.20241103.tar.zst
        sha256: bb4a9789b6e0fde1c6547f659ce591de5e691ee3a8345d3c1c74eaf92b31ea48
        dest: data
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
